[package]
name = "anon-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ab_glyph = "0.2.32"
anon-core = { version = "0.1.0", path = "../anon-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "img", "tesseract"] }
mupdf-sys = { version = "0.8", default-features = false }
tempfile = "3.27.0"

[build-dependencies]
cc = "1.11.1"

[dev-dependencies]
anon-replace = { path = "../anon-replace" }
proptest = "1.12.0"
serde_json = "1.0.154"
