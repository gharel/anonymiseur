[package]
name = "anonymiseur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ia"]
# IA de noms embarquée (ONNX Runtime + modèles de assets/ner/). À désactiver pour
# l'édition Lite et pour macOS Intel : `--no-default-features`.
ia = ["dep:anon-ner", "anon-ner/ia", "anon-ner/embed"]

[dependencies]
anon-core = { version = "2.0.0", path = "../crates/anon-core" }
anon-engine = { version = "2.0.0", path = "../crates/anon-engine" }
anon-ner = { version = "2.0.0", path = "../crates/anon-ner", default-features = false, optional = true }
# Réponse restaurée enregistrée en .docx (document Word neuf, minimal).
anon-office = { version = "2.0.0", path = "../crates/anon-office" }
anon-pdf = { version = "2.0.0", path = "../crates/anon-pdf" }
anon-replace = { version = "2.0.0", path = "../crates/anon-replace" }
anon-vault = { version = "2.0.0", path = "../crates/anon-vault" }
# Presse-papiers express : lecture et écriture du presse-papiers hors de la
# fenêtre. Déjà présent par egui-winit (même version) : aucune bibliothèque de
# plus. MIT ou Apache-2.0, aucun réseau.
arboard = { version = "3.7", default-features = false }
# Heure locale du nom de la clé de restauration (dossier-JJ-MM-AAAA-HHhMM.anonmap).
# MIT ou Apache-2.0, aucun réseau ; sans les fonctionnalités par défaut.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Dossiers Documents (exemples) et configuration (préférences) du système.
# MIT ou Apache-2.0, aucun réseau ; sous Windows, API Known Folder.
dirs = "7.0.0"
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "svg"] }
# Raccourcis globaux du presse-papiers (Ctrl+Alt+M, Ctrl+Alt+R) : RegisterHotKey
# sous Windows, Carbon sous macOS. tauri-apps, MIT ou Apache-2.0, aucun réseau.
global-hotkey = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }

[build-dependencies]
# Icône et informations de version de l'exécutable Windows (build.rs). MIT, aucun réseau :
# appelle rc.exe du SDK Windows. Sans la fonctionnalité toml (métadonnées posées dans build.rs).
winresource = { version = "0.1.34", default-features = false }
