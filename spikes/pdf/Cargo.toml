[package]
name = "pdf-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "img", "tesseract"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

