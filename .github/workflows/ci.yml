name: CI

on:
  # Branches seulement : une étiquette (version, modèles) n'a pas à relancer la CI.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Seuil de couverture (lignes, en %) pour la tâche coverage.
  COVERAGE_MIN: "80"
  # Release GitHub du dépôt qui porte les modèles .onnx (non versionnés), vérifiés contre assets/ner/SHA256SUMS.
  MODELES_RELEASE: modeles-v1

jobs:
  lint:
    name: Lint
    # anon-pdf compile MuPDF (bindgen) : le lint complet exige les mêmes outils que les tests.
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      # clippy --all-targets compile l'application complète : include_bytes! des modèles.
      - name: Récupérer les modèles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MODELES_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.onnx' --dir assets/ner --clobber
          cd assets/ner && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      # La version de la chaîne d'outils vient de rust-toolchain.toml.
      - name: Installer la chaîne d'outils
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Édition complète (fonctionnalité par défaut) : les modèles sont inclus dans le binaire.
      - name: Récupérer les modèles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MODELES_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.onnx' --dir assets/ner --clobber
          cd assets/ner && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      - name: Installer la chaîne d'outils
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Définir LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --workspace
        env:
          # Un instantané non accepté doit faire échouer, pas créer un .snap.new silencieux.
          INSTA_UPDATE: no
      - name: Arbre de travail propre
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "::error::Fichiers modifiés ou non versionnés après les tests (instantanés non acceptés, fichiers générés) :"
            echo "$status"
            exit 1
          fi

  test-lite:
    name: Test édition Lite (sans modèles)
    # Aucun modèle téléchargé : l'édition Lite doit compiler et passer ses tests sans eux.
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - name: Installer la chaîne d'outils
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: lite
      - name: Aucun modèle présent
        shell: bash
        run: |
          if ls assets/ner/*.onnx >/dev/null 2>&1; then
            echo "::error::Des modèles .onnx sont présents : le test Lite ne prouverait rien."
            exit 1
          fi
      - name: Tests de l'application (Lite)
        run: cargo test -p anonymiseur --no-default-features
        env:
          INSTA_UPDATE: no

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  no-network:
    name: Aucun réseau à l'exécution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer la chaîne d'outils
        run: rustup show active-toolchain || rustup toolchain install
      # cargo-deny tolère ureq dans le script de build d'ort-sys. Ici on vérifie
      # que rien de tel n'est lié dans l'application : arêtes normales seulement.
      - name: Arbre des dépendances normales sans crate réseau
        run: |
          interdits='^(reqwest|hyper|h2|ureq|isahc|curl|curl-sys|attohttpc|tokio|async-std|mio|socket2|native-tls|rustls|openssl|openssl-sys|tungstenite|surf|minreq|trust-dns-resolver|hickory-resolver) v'
          echec=0
          for cible in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            trouves="$(cargo tree --workspace --all-features -e normal --target "$cible" --prefix none | sort -u | grep -E "$interdits" || true)"
            if [ -n "$trouves" ]; then
              echo "::error::Crates réseau liés pour $cible :"
              echo "$trouves"
              echec=1
            fi
          done
          exit "$echec"

  coverage:
    name: Couverture
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - name: Installer la chaîne d'outils
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Ajouter llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Couverture
        shell: bash
        run: |
          cargo llvm-cov \
            -p anon-core -p anon-replace -p anon-vault -p anon-detect -p anon-dict \
            --summary-only --fail-under-lines "$COVERAGE_MIN" | tee coverage.txt
        env:
          INSTA_UPDATE: no
      - name: Résumé de la tâche
        if: always()
        shell: bash
        run: |
          {
            echo "## Couverture (seuil ${COVERAGE_MIN} % lignes)"
            echo '```'
            cat coverage.txt 2>/dev/null || echo "Aucun rapport."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Arbre de travail propre
        shell: bash
        run: |
          status="$(git status --porcelain | grep -v '^?? coverage.txt$' || true)"
          if [ -n "$status" ]; then
            echo "::error::Fichiers modifiés ou non versionnés après les tests :"
            echo "$status"
            exit 1
          fi
