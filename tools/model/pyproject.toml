[project]
name = "anon-model-tools"
version = "0.1.0"
description = "Préparation et banc d'essai du modèle NER embarqué (téléchargement, conversion, quantification, mesure). Jamais embarqué dans l'application."
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.26",
    "onnxruntime>=1.22",
    "onnx>=1.17",
    "tokenizers>=0.21",
    "transformers>=4.46",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "numpy>=2",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "odfpy>=1.4",
    "pypdf>=5",
    "onnx-ir>=1.1.0",
]

[tool.uv]
package = false
