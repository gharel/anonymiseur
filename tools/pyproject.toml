[project]
name = "anon-tools"
version = "0.1.0"
description = "Scripts de préparation de l'anonymiseur (exemples fictifs, charte, dictionnaires, modèle). Jamais embarqués dans l'application."
requires-python = ">=3.13"
dependencies = [
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "odfpy>=1.4",
    "reportlab>=4.2",
    "pillow>=11",
    "fonttools>=4.55",
    "brotli>=1.1",
    # Fournit libclang.dll pour compiler mupdf-sys sous Windows (LIBCLANG_PATH).
    "libclang==18.1.1",
]

[tool.uv]
package = false
