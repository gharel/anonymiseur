[package]
name = "anonymiseur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ia"]
# IA de noms embarquée (ONNX Runtime + modèles de assets/ner/). À désactiver pour
# l'édition Lite et pour macOS Intel : `--no-default-features`.
ia = ["dep:anon-ner", "anon-ner/ia", "anon-ner/embed"]

[dependencies]
anon-core = { version = "0.1.0", path = "../crates/anon-core" }
anon-engine = { version = "0.1.0", path = "../crates/anon-engine" }
anon-ner = { version = "0.1.0", path = "../crates/anon-ner", default-features = false, optional = true }
anon-pdf = { version = "0.1.0", path = "../crates/anon-pdf" }
anon-replace = { version = "0.1.0", path = "../crates/anon-replace" }
anon-vault = { version = "0.1.0", path = "../crates/anon-vault" }
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }

[build-dependencies]
# Icône et informations de version de l'exécutable Windows (build.rs). MIT, aucun réseau :
# appelle rc.exe du SDK Windows. Sans la fonctionnalité toml (métadonnées posées dans build.rs).
winresource = { version = "0.1.34", default-features = false }
