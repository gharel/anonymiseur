[package]
name = "anon-ner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anon-core = { version = "0.1.0", path = "../anon-core" }
anon-dict = { version = "0.1.0", path = "../anon-dict", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "lax-feature-matching", "api-31"], optional = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
whatlang = { version = "0.18", optional = true }

[features]
default = ["ia"]
# Inférence ONNX Runtime (lié statiquement ; binaires téléchargés à la compilation par
# le script de build d'ort-sys, jamais à l'exécution). Sans elle, le crate compile et
# `NerDetector` renvoie `NerError::Unavailable` (cible macOS Intel : pas de binaires).
ia = ["dep:ort", "dep:tokenizers", "dep:whatlang", "dep:anon-dict"]
# Modèle, tokeniseur et configuration inclus dans le binaire depuis `assets/ner/`.
embed = ["ia"]
