name: Pages

# Publie le dossier site/ sur GitHub Pages.
# Réglage requis une fois : Settings, Pages, Source = « GitHub Actions ».
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Après une release, seulement si elle a réussi.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-2.outputs.page_url || steps.deployment-3.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Empreintes de la dernière release : jamais écrites en dur dans la page.
      # Sans release, empreintes.json n'existe pas et la page affiche un message.
      - name: Empreintes SHA-256 de la dernière release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sums"
          if gh release download --repo gharel/anonymiseur --pattern SHA256SUMS --dir "$RUNNER_TEMP/sums" --clobber; then
            python3 - "$RUNNER_TEMP/sums/SHA256SUMS" site/empreintes.json <<'PY'
          import json, sys
          out = {}
          for ligne in open(sys.argv[1], encoding="utf-8"):
              parts = ligne.split()
              if len(parts) == 2:
                  out[parts[1].lstrip("*")] = parts[0].lower()
          json.dump(out, open(sys.argv[2], "w", encoding="utf-8"), indent=2)
          PY
            cat site/empreintes.json
          else
            echo "Aucune release publiée : page sans empreintes."
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # deploy-pages ne trouve parfois pas l'archive qui vient d'être envoyée (« No artifacts named
      # "github-pages" were found ») : on retente la publication après 20 s, puis après 60 s.
      - name: Publier sur GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Patienter avant un deuxième essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Publier sur GitHub Pages (2e essai)
        id: deployment-2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Patienter avant un troisième essai
        if: steps.deployment-2.outcome == 'failure'
        run: sleep 60
      - name: Publier sur GitHub Pages (3e essai)
        id: deployment-3
        if: steps.deployment-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
