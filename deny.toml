# Configuration cargo-deny. Invariant 1 (AGENTS.md) : aucune dépendance réseau à l'exécution.

[graph]
all-features = true
# Seules les plateformes livrées comptent : sans cette liste, des dépendances
# propres à wasm ou à Linux (tokio via wasm-bindgen-futures, openssl) seraient
# signalées alors qu'elles ne sont jamais compilées dans l'application.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
# Toute vulnérabilité connue fait échouer la vérification.
yanked = "deny"
# Un crate « non maintenu » n'est bloquant que s'il est une dépendance directe :
# on ne peut pas remplacer ceux que tirent egui, wgpu ou tokenizers (paste,
# ttf-parser), et ce ne sont pas des vulnérabilités.
unmaintained = "workspace"
ignore = [
    # Exemple : "RUSTSEC-0000-0000",  # raison écrite ici
]

[licenses]
version = 2
# Licences compatibles avec une distribution sous AGPL-3.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    # Polices par défaut d'egui (repli pour les glyphes absents de Georama) :
    # la licence autorise l'embarquement et la redistribution.
    "Ubuntu-font-1.0",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    # Modèles ou données sous LGPL, à activer si nécessaire :
    # "LGPL-3.0",
    # "LGPL-3.0-or-later",
]
confidence-threshold = 0.8
# Les avertissements « license-not-encountered » sont attendus : la liste anticipe les futures dépendances.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les dépendances de chemin de l'espace de travail n'ont pas de version : autorisé.
allow-wildcard-paths = true

# Crates réseau interdits à l'exécution.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "h2" },
    # `ureq` et `native-tls` ne sont admis que pour le script de build d'`ort-sys`,
    # qui télécharge ONNX Runtime à la compilation. Ils ne sont pas liés dans
    # l'application : la tâche CI « aucun réseau à l'exécution » le vérifie sur
    # l'arbre des dépendances normales.
    { name = "ureq", wrappers = ["ort-sys"] },
    { name = "native-tls", wrappers = ["ureq"] },
    { name = "isahc" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "attohttpc" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "mio" },
    { name = "socket2" },
    { name = "rustls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "tungstenite" },
    { name = "surf" },
    { name = "minreq" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Dépendance git éventuelle (à justifier dans le commit) :
# allow-git = ["https://github.com/exemple/depot"]
