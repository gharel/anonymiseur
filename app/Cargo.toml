[package]
name = "anonymiseur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anon-core = { version = "0.1.0", path = "../crates/anon-core" }
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
